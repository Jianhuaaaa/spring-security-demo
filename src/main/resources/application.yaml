spring:
  # 数据源配置
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  # H2控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console
  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
        bytecode:
          enhancement:
            lazy_attribute_fetching: true

# JWT配置
jwt:
  secret: 7f4dcc3b5aa765d61d8327deb882cf99b6d7f99f2b07b3d4a87a57b0c2e1d4c3
  expiration: 86400000  # 24小时，单位毫秒

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# SpringDoc配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method